{% load static %}

{% block styles %}
<link rel="stylesheet" href="{% static 'users/css/flash_messages.css' %}">
{% endblock styles %}

<div id="message-container" class="messages">
    {% if messages %}
        <ul>
            {% for message in messages %}
                <li class="message {{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}
</div>
